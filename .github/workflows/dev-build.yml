name: Dev Build

on:
  push:
    branches:
      - dev
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'research/**'
      - 'context/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      client-shared: ${{ steps.filter.outputs.client-shared }}
      linux: ${{ steps.filter.outputs.linux }}
      windows: ${{ steps.filter.outputs.windows }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      macos: ${{ steps.filter.outputs.macos }}
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
      dev-build-workflow: ${{ steps.filter.outputs.dev-build-workflow }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client-shared:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
            linux:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
              - 'apps/client/linux/**'
            windows:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
              - 'apps/client/windows/**'
            android:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
              - 'apps/client/android/**'
            ios:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
              - 'apps/client/ios/**'
            macos:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
              - 'apps/client/macos/**'
            web:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
              - 'apps/client/web/**'
              - 'apps/client/Dockerfile.web'
            server:
              - 'apps/server/**'
              - 'core/rust-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/server/Dockerfile'
            dev-build-workflow:
              - '.github/workflows/dev-build.yml'

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    needs: [paths]
    if: needs.paths.outputs.linux == 'true' || needs.paths.outputs.dev-build-workflow == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Cache AppImage tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/echo-appimage-tools
          key: appimage-tools-v1
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libfuse2 libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good libsecret-1-dev libayatana-appindicator3-dev libasound2-dev libmpv-dev
      - name: Build
        working-directory: apps/client
        run: flutter build linux --release --dart-define=APP_VERSION=dev
      - name: Package tar.gz
        run: |
          cd apps/client/build/linux/x64/release/bundle
          tar czf ${{ github.workspace }}/echo-linux-dev.tar.gz .
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-linux
          path: echo-linux-dev.tar.gz
          retention-days: 7

  build-windows:
    name: Build Windows Portable Zip
    runs-on: windows-latest
    needs: [paths]
    if: needs.paths.outputs.windows == 'true' || needs.paths.outputs.dev-build-workflow == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Build
        working-directory: apps/client
        run: flutter build windows --release --dart-define=APP_VERSION=dev
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path apps/client/build/windows/x64/runner/Release/* -DestinationPath echo-windows-dev-portable.zip
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-windows
          path: echo-windows-dev-portable.zip
          retention-days: 7

  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    needs: [paths]
    if: needs.paths.outputs.android == 'true' || needs.paths.outputs.dev-build-workflow == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/client/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/client/android/**/*.gradle*', 'apps/client/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build debug APK
        working-directory: apps/client
        run: flutter build apk --debug --dart-define=APP_VERSION=dev
      - name: Rename APK
        run: |
          cp apps/client/build/app/outputs/flutter-apk/app-debug.apk \
             echo-android-dev.apk
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-android
          path: echo-android-dev.apk
          retention-days: 7

  build-ios:
    name: Build iOS (no-codesign)
    # iOS uses macOS-15 runners which cost 10x Linux.  Gate on either an
    # explicit workflow_dispatch OR a `[ci-ios]` marker in the commit
    # message to avoid burning minutes on every iOS-adjacent push.
    runs-on: macos-15
    needs: [paths]
    if: |
      (needs.paths.outputs.ios == 'true' || needs.paths.outputs.dev-build-workflow == 'true')
      && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci-ios]'))
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            apps/client/ios/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-ios-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-ios-
      - name: Build iOS (no codesign)
        working-directory: apps/client
        run: flutter build ios --release --no-codesign --dart-define=APP_VERSION=dev

  build-macos:
    name: Build macOS
    # macOS runners are 10x cost — keep behind manual dispatch in addition
    # to the path gate.
    runs-on: macos-15
    needs: [paths]
    if: |
      github.event_name == 'workflow_dispatch'
      && (needs.paths.outputs.macos == 'true' || needs.paths.outputs.dev-build-workflow == 'true')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            apps/client/macos/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-macos-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-macos-
      - name: Disable sandbox for dev build
        run: |
          # Dev builds are unsigned — sandbox blocks Keychain without a valid
          # signing identity. Disable it so flutter_secure_storage works.
          ENT=apps/client/macos/Runner/Release.entitlements
          /usr/libexec/PlistBuddy -c "Set :com.apple.security.app-sandbox false" "$ENT"
          /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups" "$ENT" 2>/dev/null || true
      - name: Build
        working-directory: apps/client
        run: flutter build macos --release --dart-define=APP_VERSION=dev
      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - \
            --entitlements apps/client/macos/Runner/Release.entitlements \
            apps/client/build/macos/Build/Products/Release/Echo.app
      - name: Package
        run: |
          cd apps/client/build/macos/Build/Products/Release
          tar czf ${{ github.workspace }}/echo-macos-dev.tar.gz Echo.app
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-macos
          path: echo-macos-dev.tar.gz
          retention-days: 7

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [paths]
    if: needs.paths.outputs.web == 'true' || needs.paths.outputs.dev-build-workflow == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Build
        working-directory: apps/client
        run: flutter build web --release --pwa-strategy=none --dart-define=APP_VERSION=dev
      - name: Package
        run: |
          cd apps/client/build/web
          tar czf ${{ github.workspace }}/echo-web-dev.tar.gz .
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-web
          path: echo-web-dev.tar.gz
          retention-days: 7

  build-server:
    name: Build Server (cargo build + test)
    runs-on: ubuntu-latest
    needs: [paths]
    if: needs.paths.outputs.server == 'true' || needs.paths.outputs.dev-build-workflow == 'true'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: echo_test
          POSTGRES_USER: echo
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echo -d echo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: dev-build-server
      - name: Build release
        run: cargo build --release --package echo-server
      - name: Run server tests
        run: cargo test --package echo-server
        env:
          DATABASE_URL: postgres://echo:test_password@localhost:5432/echo_test
          JWT_SECRET: ${{ format('ci-test-secret-{0}-attempt-{1}-padding', github.run_id, github.run_attempt) }}
      - name: Package
        run: |
          mkdir -p echo-server-pkg
          cp target/release/echo-server echo-server-pkg/
          cp -r apps/server/migrations echo-server-pkg/
          cp .env.example echo-server-pkg/
          cd echo-server-pkg && tar czf ${{ github.workspace }}/echo-server-dev-linux-x64.tar.gz .
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-server
          path: echo-server-dev-linux-x64.tar.gz
          retention-days: 7

  docker-build-dev-server:
    name: Build Server :dev image
    runs-on: ubuntu-latest
    needs: [paths]
    if: needs.paths.outputs.server == 'true' || needs.paths.outputs.dev-build-workflow == 'true'
    permissions:
      contents: read
      packages: write
    environment:
      name: development
      url: https://dev.echo-messenger.us
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short
      # Only push from the `dev` branch.  feature/* and fix/* branches
      # still build for verification but don't pollute ghcr with tags
      # we'd never pull from.  `:dev` itself is rolling; `dev-<sha>` is
      # the rollback handle if `:dev` breaks.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/server/Dockerfile
          push: ${{ github.ref == 'refs/heads/dev' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-dev-web:
    name: Build Web :dev image
    runs-on: ubuntu-latest
    needs: [paths]
    if: needs.paths.outputs.web == 'true' || needs.paths.outputs.dev-build-workflow == 'true'
    permissions:
      contents: read
      packages: write
    environment:
      name: development
      url: https://dev.echo-messenger.us
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Build Flutter web
        working-directory: apps/client
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none --dart-define=APP_VERSION=dev
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/client
          file: apps/client/Dockerfile.web
          push: ${{ github.ref == 'refs/heads/dev' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            APP_VERSION=dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
