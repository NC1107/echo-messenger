# Build distro packages (.deb + .rpm) for the Linux desktop client and attach
# them to the GitHub Release. Kept SEPARATE from release.yml on purpose: a
# packaging hiccup must never block the main release pipeline. Runs when a
# release is published, and on-demand via workflow_dispatch for testing.
name: Linux Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (no leading v); defaults to 0.0.0-dev"
        required: false
        default: ""

permissions:
  contents: write # needed to upload assets to the release

concurrency:
  group: linux-packages-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build-packages:
    name: Build .deb + .rpm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          v="${v#v}"
          v="${v:-0.0.0-dev}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Packaging version: $v"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-

      - name: Install build deps + packaging tools
        run: |
          sudo apt-get update
          # Build deps mirror the release.yml build-linux job; `rpm` provides
          # rpmbuild so fpm can emit .rpm on the Ubuntu runner; fpm itself is a
          # Ruby gem.
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libsecret-1-dev libayatana-appindicator3-dev \
            libasound2-dev libmpv-dev \
            rpm
          sudo gem install --no-document fpm

      - name: Flutter dependencies
        working-directory: apps/client
        run: flutter pub get

      - name: Build Linux release bundle
        working-directory: apps/client
        run: flutter build linux --release --dart-define=APP_VERSION=${{ steps.ver.outputs.version }}

      - name: Build .deb + .rpm
        run: bash scripts/package_linux.sh "${{ steps.ver.outputs.version }}" dist

      - name: Attach packages to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.deb dist/*.rpm --clobber

      - name: Upload packages as artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
