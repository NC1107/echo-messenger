name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'research/**'
      - 'context/**'
      - 'architecture/**'
      - 'meta/**'

permissions:
  contents: write
  # packages: write intentionally omitted at workflow level (#833 finding 2).
  # Only the docker and build-web jobs need it; granted per-job below.

# #530: serialize release runs on main so two concurrent pushes don't race
# on the version tag and ghcr.io image tags.  cancel-in-progress=false is
# required: cancelling a half-published release leaves orphan tags and
# partial image pushes -- queueing the next push is safer than racing.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  paths:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client-shared: ${{ steps.filter.outputs.client-shared }}
      linux: ${{ steps.filter.outputs.linux }}
      windows: ${{ steps.filter.outputs.windows }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      macos: ${{ steps.filter.outputs.macos }}
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
      rust-deps: ${{ steps.filter.outputs.rust-deps }}
      any-client: ${{ steps.filter.outputs.any-client }}
      release-workflow: ${{ steps.filter.outputs.release-workflow }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Release runs on push to main; compare against the previous
          # commit so the filter reflects the merge's changes.
          base: ${{ github.event.before }}
          filters: |
            client-shared:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
            linux:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
              - 'apps/client/linux/**'
            windows:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
              - 'apps/client/windows/**'
            android:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
              - 'apps/client/android/**'
            ios:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
              - 'apps/client/ios/**'
            macos:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
              - 'apps/client/macos/**'
            web:
              - 'apps/client/pubspec.yaml'
              - 'apps/client/pubspec.lock'
              - 'apps/client/lib/**'
              - 'apps/client/test/**'
              - '.flutter-version'
              - 'apps/client/web/**'
              - 'apps/client/Dockerfile.web'
            server:
              - 'apps/server/**'
              - 'core/rust-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/server/Dockerfile'
            rust-deps:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'deny.toml'
              - '.cargo/audit.toml'
            any-client:
              - 'apps/client/**'
              - '.flutter-version'
            release-workflow:
              - '.github/workflows/release.yml'

  security-pre-release:
    name: Security pre-release scan
    needs: [paths]
    if: needs.paths.outputs.rust-deps == 'true' || needs.paths.outputs.release-workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: security-gate
      - run: cargo install cargo-audit --locked
      # Mirrors .github/workflows/security.yml ignore set:
      # RUSTSEC-2023-0071: transitive rsa advisory via jsonwebtoken (no upstream patch).
      # RUSTSEC-2026-0097: rand 0.8.5 unsound advisory, pinned by sqlx 0.8.6 transitively.
      - run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0097
      - uses: EmbarkStudios/cargo-deny-action@175dc7fd4fb85ec8f46948fb98f44db001149081 # v2.0.16

  lint-test-rust:
    name: Lint + Test (Rust)
    needs: [paths, security-pre-release]
    # When security-pre-release is skipped (no Rust dep changes) GitHub
    # propagates the skip; `always() && (...)` lets this job run on its
    # own gate as long as security didn't actively fail.
    if: |
      always()
      && (needs.security-pre-release.result == 'success' || needs.security-pre-release.result == 'skipped')
      && (needs.paths.outputs.server == 'true' || needs.paths.outputs.release-workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: echo_test
          POSTGRES_USER: echo
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echo -d echo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: release-lint-rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
        env:
          DATABASE_URL: postgres://echo:test_password@localhost:5432/echo_test
          JWT_SECRET: ${{ format('ci-test-secret-{0}-attempt-{1}-padding', github.run_id, github.run_attempt) }}

  lint-test-flutter:
    name: Lint + Test (Flutter)
    needs: [paths, security-pre-release]
    if: |
      always()
      && (needs.security-pre-release.result == 'success' || needs.security-pre-release.result == 'skipped')
      && (needs.paths.outputs.any-client == 'true' || needs.paths.outputs.release-workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Flutter dependencies
        working-directory: apps/client
        run: flutter pub get
      - name: Dart format check
        working-directory: apps/client
        run: dart format --set-exit-if-changed .
      - name: Flutter analyze
        working-directory: apps/client
        run: flutter analyze --fatal-infos
      - name: Flutter tests
        working-directory: apps/client
        run: flutter test

  version:
    name: Calculate Version
    needs: [paths, lint-test-rust, lint-test-flutter]
    # Tag every main push (builds always run on main), but only after
    # whichever lint jobs ran have actually passed.  A skipped lint job
    # (no Rust or no Flutter changes) is fine; a failed one blocks.
    if: |
      always()
      && (needs.lint-test-rust.result == 'success' || needs.lint-test-rust.result == 'skipped')
      && (needs.lint-test-flutter.result == 'success' || needs.lint-test-flutter.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Reserve next version tag (atomic)
        id: version
        # #530: reserve the tag IMMEDIATELY (before expensive builds) so
        # downstream jobs reference a real persistent tag.  The retry loop
        # complements the workflow-level concurrency group by handling
        # manual `git push origin vX.Y.Z` between CI runs without aborting
        # the release.  If a build later fails the orphan tag is left in
        # place; the next release auto-bumps past it.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --quiet origin

          PUSH_ERR=$(mktemp)
          trap 'rm -f "$PUSH_ERR"' EXIT

          for attempt in 1 2 3 4 5; do
            # for-each-ref --count=1 writes exactly one line and exits
            # cleanly. The previous `git tag -l | head -1` was racy under
            # `set -o pipefail`: once the tag list grew past ~450 entries,
            # `head` closed the pipe before `git tag` finished writing,
            # `git tag` got SIGPIPE, and the pipeline exited 141 on the
            # first loop iteration — masking the actual reserve logic.
            LATEST=$(git for-each-ref --count=1 --sort=-v:refname \
              --format='%(refname:short)' 'refs/tags/v*')
            if [ -z "$LATEST" ]; then
              LATEST="v0.0.0"
            fi

            VERSION="${LATEST#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            PATCH=$((PATCH + 1))

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            NEW_TAG="v${NEW_VERSION}"

            # Idempotency: if a prior attempt of this same step already
            # pushed the tag (e.g. step retry, runner restart), short-
            # circuit to success rather than re-tagging and aborting.
            if git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" >/dev/null 2>&1; then
              REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$NEW_TAG" | awk '{print $1}')
              LOCAL_SHA=$(git rev-parse HEAD)
              if [ "$REMOTE_SHA" = "$LOCAL_SHA" ] || git merge-base --is-ancestor "$LOCAL_SHA" "$REMOTE_SHA" 2>/dev/null; then
                echo "Tag $NEW_TAG already reserved by this run; skipping push"
                echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
                echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Tag exists but points elsewhere -- bump and retry.
              git fetch --tags --quiet origin
              continue
            fi

            git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
            if git push origin "$NEW_TAG" 2>"$PUSH_ERR"; then
              echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
              echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
              echo "Reserved $NEW_TAG (previous: $LATEST, attempt $attempt)"
              exit 0
            fi

            echo "Push of $NEW_TAG lost a race (attempt $attempt):"
            cat "$PUSH_ERR" || true
            git tag -d "$NEW_TAG"
            git fetch --tags --quiet origin
          done

          echo "::error::Failed to reserve a release tag after 5 attempts"
          exit 1

  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [paths, version, lint-test-flutter]
    if: |
      always()
      && needs.version.result == 'success'
      && (needs.lint-test-flutter.result == 'success' || needs.lint-test-flutter.result == 'skipped')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Cache AppImage tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/echo-appimage-tools
          key: appimage-tools-v1
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # libsndio7-dev + libjack-jackd2-dev are required so the
          # bundling step can resolve libmpv's hard-linked audio
          # backends via ldd.  Without them, ldd reports "not found"
          # and walk_deps silently skips them, shipping a bundle that
          # fails on every user host that doesn't have them either
          # (sndio is OpenBSD's audio daemon, jack is pro-audio —
          # neither is on typical Linux desktops).
          sudo apt-get install -y \
            clang cmake ninja-build \
            libgtk-3-dev libfuse2 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            libsecret-1-dev libayatana-appindicator3-dev \
            libasound2-dev libmpv-dev \
            libsndio-dev libjack-jackd2-dev
      - name: Build
        working-directory: apps/client
        run: flutter build linux --release --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
      - name: Package tar.gz
        run: |
          cd apps/client/build/linux/x64/release/bundle
          tar czf ${{ github.workspace }}/echo-linux-x64.tar.gz .
      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p Echo.AppDir/usr/bin Echo.AppDir/usr/share/applications Echo.AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r apps/client/build/linux/x64/release/bundle/* Echo.AppDir/usr/bin/
          # Bundle libmpv.so.2 (and runtime deps) inside the AppImage so it
          # actually runs on hosts that don't ship libmpv globally.
          # `media_kit_libs_video` declares a runtime dependency on libmpv
          # via the dynamic linker but does NOT copy the .so into the
          # bundle, which left users hitting "libmpv.so.2: cannot open
          # shared object file" at launch (reported 2026-05-08).  AppRun
          # already prepends usr/bin/lib to LD_LIBRARY_PATH so the loader
          # finds these copies.
          mkdir -p Echo.AppDir/usr/bin/lib
          LIBMPV_PATH=$(ldconfig -p | awk '/libmpv\.so\.2 / {print $4; exit}')
          if [ -z "$LIBMPV_PATH" ] || [ ! -e "$LIBMPV_PATH" ]; then
            echo "::error::libmpv.so.2 not resolvable on the build host; install libmpv2 or libmpv-dev before this step."
            exit 1
          fi
          cp -L "$LIBMPV_PATH" Echo.AppDir/usr/bin/lib/
          # Deny-list approach (replaces the per-lib allowlist after we
          # hit libjpeg / libsixel / libjxl / etc. one-by-one across
          # v0.0.296..v0.0.301).  Bundle EVERY transitive dep of libmpv
          # + echo_app that isn't in the deny list, then validate with
          # `ldd` that no soname is unresolved against the bundle path.
          #
          # The deny list covers libs that vary across distros and must
          # come from the user's host — bundling them shadows the host
          # version and breaks symbol lookups (e.g. v0.0.296's broken
          # bundle of libglib-2.0 on Fedora 43 caused
          # "undefined symbol: g_variant_builder_*" at startup).
          # Keep this list tight and additive; everything else gets
          # bundled.
          # Layered deny list: keep libs that must come from the user's
          # host so they can talk to the host's display server, audio
          # daemon, dbus, etc.  Bundling these would shadow the host's
          # service-talking versions and break routing.  Everything not
          # matched here gets bundled.
          DENY_GROUPS=(
            # Core C runtime + ELF loader.
            'ld-linux|libc\.so|libm\.so|libpthread\.so|librt\.so|libdl\.so'
            'libgcc_s\.so|libstdc\+\+\.so|libgomp\.so|libnsl\.|libresolv\.'
            'libutil\.|libanl\.|libcrypt\.|libcap\.'

            # GLib / GObject / GIO — system glue, must match host.
            'libglib-|libgio-|libgobject-|libgthread-|libgmodule-'

            # GTK / Pango / Cairo / Harfbuzz / Fonts — display chain.
            'libgtk-|libgdk-|libgdk_pixbuf-|libpango-|libpangocairo-|libpangoft'
            'libcairo-|libcairo\.|libharfbuzz|libatk-|libatk\.'
            'libfontconfig|libfreetype|libdatrie|libthai|libgraphite2|libfribidi'

            # X / Wayland / GL — windowing + GPU.
            'libxkbcommon|libwayland|libxcb|libX11|libXext|libXi|libXrender'
            'libXrandr|libXcomposite|libXdamage|libXfixes|libXcursor|libXau'
            'libXdmcp|libXinerama|libXxf86vm|libdrm|libgbm|libEGL|libGLESv2'
            'libGL\.|libGLX|libGLdispatch|libxshmfence'

            # Audio daemons that users have (ALSA / PulseAudio / PipeWire)
            # MUST come from the host so they reach the running daemon.
            # libsndio + libjack intentionally NOT here — they're rare
            # (OpenBSD / pro-audio) and most Linux desktops don't ship
            # them, so we bundle them.  libmpv hard-links them.
            'libasound|libpulse|libpipewire|libapulse'

            # GStreamer + GNOME / KDE shell integrations — pulled in by
            # GTK image loaders, file pickers, tray indicators, etc.
            # Bundling these breaks if the host's gst-plugins / GIO
            # modules don't match the bundled lib version.
            'libgstreamer|libgst[a-z]+-|libgstapp|libgstbase|libgstvideo|libgstaudio'
            'libcloudproviders|libayatana|libappindicator|libtinysparql|libjson-glib'
            'libglycin|libdconf|libgsettings'

            # System services / IPC.
            'libdbus|libsystemd|libudev|libelogind|libavahi'

            # util-linux suite — libmount + libblkid are tightly coupled
            # to the host's libgio version via MOUNT_2.* symbol versions.
            # Bundling an Ubuntu-built libmount shadows the host's and
            # breaks libgio symbol lookups on Fedora 44+ (#v0.0.303
            # incident).
            'libmount|libblkid|libsmartcols|libuuid|libfdisk'

            # ICU (text + Unicode) — Ubuntu and Fedora ship different
            # major versions (74 vs 76+); symbol mismatches surface as
            # silent crashes in GTK/Pango when bundled.
            'libicudata|libicuuc|libicui18n|libicutu|libicuio'

            # GPU / video acceleration — talks to host kernel + driver.
            'libvulkan|libvdpau|libva\.|libva-drm|libva-wayland|libva-x11'
            'libGLdispatch|libGLU|libnvidia'

            # Compiler runtimes + ELF tooling.
            'libgfortran|libgomp\.|libunwind|libdw\.|libquadmath'

            # Wayland decorations / theming — must match compositor.
            'libdecor-0|libdecor'

            # ncurses / terminal info — host's terminfo data is
            # /etc/terminfo, not bundlable.
            'libtinfo|libncurses|libslang'

            # GLib / gobject introspection extras (some pulled by
            # libgio in addition to the libglib- pattern above).
            'libgirepository|libgthread'

            # Misc gettext + libunistring + libidn2 — distros patch
            # these for locale data; bundling causes UTF-8 weirdness.
            'libgettext|libintl|libunistring|libidn2'

            # System crypto / TLS — distros patch these heavily.
            'libcrypto\.|libssl\.|libgcrypt|libgpg-error|libgnutls|libtasn1'
            'libnettle|libhogweed|libidn|libldap|libsasl|libkrb5|libcom_err'
            'libkeyutils|libk5crypto|libgssapi|libp11-kit'
            'libnss|libnspr|libplc4|libplds4|libsmime3|libnssutil3|libfreebl3|libsoftokn3'

            # Compression + utilities that are universally present.
            # libbz2 intentionally NOT here: Debian-flavored sonames
            # (libbz2.so.1.0) don't exist on Fedora (which ships
            # libbz2.so.1), so bundling is safer than relying on host.
            'libpcre|libffi|libelf|libz\.so|liblzma|liblzo|libzstd|libdatum'

            # Misc system libs.
            'libxml2|libxslt|libsqlite|libapparmor|libselinux|libacl|libattr'
            'libsoup|libsecret|libnotify|libcanberra|libbsd|libmd\.so|libusb'
          )
          DENY_RE="^($(IFS='|'; echo "${DENY_GROUPS[*]}"))"

          # Bundle every transitive dep of libmpv + echo_app that isn't
          # in DENY_RE.  Repeating safe — cp -n is no-clobber.
          walk_deps() {
            local target="$1"
            [ -f "$target" ] || return 0
            ldd "$target" 2>/dev/null | awk '/=>/ {print $3}' \
              | while read -r dep; do
                  [ -z "$dep" ] || [ ! -e "$dep" ] && continue
                  base=$(basename "$dep")
                  if echo "$base" | grep -qE "$DENY_RE"; then
                    continue
                  fi
                  cp -Ln "$dep" Echo.AppDir/usr/bin/lib/ 2>/dev/null || true
                done
          }

          walk_deps "$LIBMPV_PATH"
          walk_deps Echo.AppDir/usr/bin/echo_app
          # Walk recursively over the bundled libs themselves so anything
          # that ldd missed on the first pass (because LD_LIBRARY_PATH
          # was system-only) gets caught.  Two passes is enough for our
          # dep depth.
          for _ in 1 2; do
            for lib in Echo.AppDir/usr/bin/lib/*.so*; do
              walk_deps "$lib"
            done
          done

          ls Echo.AppDir/usr/bin/lib/libmpv* > /dev/null  # sanity check
          ls Echo.AppDir/usr/bin/lib/libjpeg* > /dev/null || {
            echo "::error::libjpeg not bundled; the deny list or ldd walk regressed."
            exit 1
          }
          echo "Bundled libs:"; ls -1 Echo.AppDir/usr/bin/lib/ | sort

          # Validation: walk DT_NEEDED on echo_app + every bundled .so
          # and confirm each soname is EITHER bundled OR matches the
          # deny regex (= explicitly expected from user's host).
          #
          # We deliberately don't use `ldd` here: ldd resolves against
          # the build host's installed packages, so a lib that happens
          # to be on the Ubuntu CI runner via libmpv-dev's deps (e.g.
          # libsndio) shows up as "resolved" even though the user's
          # Fedora host doesn't have it.  That gap is what shipped
          # broken v0.0.302 to a user.  DT_NEEDED checks the actual
          # ELF dependency declarations, independent of the host.
          echo "=== AppImage dep validation ==="
          NEEDED=$(objdump -p Echo.AppDir/usr/bin/echo_app \
              Echo.AppDir/usr/bin/lib/*.so* 2>/dev/null \
              | awk '/NEEDED/ {print $2}' | sort -u)
          MISSING=()
          for soname in $NEEDED; do
            # In the bundle? OK.
            if [ -e "Echo.AppDir/usr/bin/lib/$soname" ]; then
              continue
            fi
            # Explicitly expected from user's host? OK.
            if echo "$soname" | grep -qE "$DENY_RE"; then
              continue
            fi
            MISSING+=("$soname")
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Needed sonames neither bundled nor in DENY_RE:"
            printf '  %s\n' "${MISSING[@]}"
            echo "::error::Either let the deny list keep excluding these"
            echo "::error::(if every user host is guaranteed to have them)"
            echo "::error::OR remove the matching deny pattern so they get"
            echo "::error::bundled.  See the libsndio incident in v0.0.302."
            exit 1
          fi
          NEEDED_COUNT=$(printf '%s\n' "$NEEDED" | wc -l)
          echo "All ${NEEDED_COUNT} needed sonames resolved against bundle or deny list ✓"
          cat > Echo.AppDir/echo.desktop << 'EOF'
          [Desktop Entry]
          Name=Echo
          Comment=Encrypted Messaging
          Exec=echo_app
          Icon=echo
          Type=Application
          Categories=Network;InstantMessaging;
          StartupNotify=true
          StartupWMClass=com.echo.echo_app
          EOF
          cp Echo.AppDir/echo.desktop Echo.AppDir/usr/share/applications/
          # Placeholder icon
          magick public/white_echo_icon.png -gravity center -background none -extent 1408x1408 -resize 256x256 Echo.AppDir/echo.png || \
          cp public/white_echo_icon.png Echo.AppDir/echo.png
          cp Echo.AppDir/echo.png Echo.AppDir/usr/share/icons/hicolor/256x256/apps/
          # Slice 9: ship the same icon next to the binary so the GTK
          # runner's gtk_window_set_icon_from_file("<exe>/data/echo-messenger.png")
          # path resolves at runtime → alt-tab thumbnail.
          mkdir -p Echo.AppDir/usr/bin/data
          cp Echo.AppDir/echo.png Echo.AppDir/usr/bin/data/echo-messenger.png
          cat > Echo.AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/echo_app" "$@"
          APPRUN
          chmod +x Echo.AppDir/AppRun
          ARCH=x86_64 ./appimagetool --no-appstream Echo.AppDir Echo-x86_64.AppImage || \
          ARCH=x86_64 ./appimagetool Echo.AppDir Echo-x86_64.AppImage
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: |
            echo-linux-x64.tar.gz
            Echo-x86_64.AppImage
          retention-days: 3

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    needs: [paths, version, lint-test-flutter]
    if: |
      always()
      && needs.version.result == 'success'
      && (needs.lint-test-flutter.result == 'success' || needs.lint-test-flutter.result == 'skipped')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Build
        working-directory: apps/client
        run: flutter build windows --release --verbose --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
      - name: Create InnoSetup script
        shell: pwsh
        run: |
          @"
          [Setup]
          AppId={{B2F5B7D4-9F4A-4E2C-9D71-EC1107EC1107}}
          AppName=Echo Messenger
          AppVersion=${{ needs.version.outputs.version }}
          AppPublisher=Echo Messenger (NC1107)
          AppPublisherURL=https://github.com/NC1107/echo-messenger
          AppSupportURL=https://github.com/NC1107/echo-messenger/issues
          AppUpdatesURL=https://github.com/NC1107/echo-messenger/releases
          AppCopyright=Copyright (C) 2026 NC1107
          VersionInfoCompany=Echo Messenger (NC1107)
          VersionInfoProductName=Echo Messenger
          DefaultDirName={autopf}\Echo
          DefaultGroupName=Echo
          OutputDir=.
          OutputBaseFilename=Echo-Setup-x64
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\echo_app.exe
          SetupIconFile=

          [Files]
          Source: "apps\client\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs

          [Icons]
          Name: "{group}\Echo"; Filename: "{app}\echo_app.exe"
          Name: "{commondesktop}\Echo"; Filename: "{app}\echo_app.exe"
          Name: "{group}\Uninstall Echo"; Filename: "{uninstallexe}"

          [Run]
          Filename: "{app}\echo_app.exe"; Description: "Launch Echo"; Flags: postinstall nowait
          "@ | Out-File -Encoding ASCII echo-setup.iss
      - name: Build installer
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" echo-setup.iss
      # Code-signing placeholder. Skipped until WINDOWS_CERT_PFX_BASE64 secret is configured.
      # Once a code-signing cert is acquired, set repository secrets:
      #   WINDOWS_CERT_PFX_BASE64      -- base64-encoded .pfx contents
      #   WINDOWS_CERT_PFX_PASSWORD    -- password for the .pfx
      # See docs/SMARTSCREEN_WORKAROUND.md for context (#903).
      - name: Sign installer (if cert available)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
        run: |
          [System.IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          }
          & $signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PFX_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 Echo-Setup-x64.exe
          Remove-Item cert.pfx
      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path apps/client/build/windows/x64/runner/Release/* -DestinationPath echo-windows-x64-portable.zip
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            Echo-Setup-x64.exe
            echo-windows-x64-portable.zip
          retention-days: 3

  build-android:
    name: Build Android APK + AAB
    runs-on: ubuntu-latest
    needs: [paths, version, lint-test-flutter]
    if: |
      always()
      && needs.version.result == 'success'
      && (needs.lint-test-flutter.result == 'success' || needs.lint-test-flutter.result == 'skipped')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/client/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/client/android/**/*.gradle*', 'apps/client/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Verify Android signing secrets present
        # Release context only — this job runs solely on push to `main` (see
        # the workflow-level `on:` block) and on `workflow_dispatch`. In that
        # context an unsigned APK is never acceptable: Play Store rejects it
        # and side-loaded users get a confusing install-blocked dialog. Hard
        # fail so a missing secret surfaces as a release error instead of a
        # silently-skipped platform (#357).
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_PROPERTIES" ]; then
            echo "::error::Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PROPERTIES) are missing. Refusing to ship an unsigned release APK."
            exit 1
          fi
      - name: Set up signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/client/android/echo-release.jks
          echo "$ANDROID_KEY_PROPERTIES" > apps/client/android/key.properties
      - name: Build APK
        working-directory: apps/client
        run: flutter build apk --release --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
      - name: Build AAB
        # The AAB is what Play Store accepts; APK stays for GitHub Release
        # side-loaders. Two separate `flutter build` invocations because each
        # produces a different artifact and there's no `--all` flag.
        working-directory: apps/client
        run: flutter build appbundle --release --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
      - name: Rename artifacts
        run: |
          cp apps/client/build/app/outputs/flutter-apk/app-release.apk \
             echo-android-${{ needs.version.outputs.version }}.apk
          cp apps/client/build/app/outputs/bundle/release/app-release.aab \
             echo-android-${{ needs.version.outputs.version }}.aab
      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: |
            echo-android-*.apk
            echo-android-*.aab
          retention-days: 3
      - name: Publish to Play Console Internal testing
        # Only on direct main pushes (not workflow_dispatch / not PR builds).
        # Internal testing publishes are instant and don't require Google review,
        # so this fires on every release. Skipped silently if PLAY_SERVICE_ACCOUNT_JSON
        # isn't set so contributors building locally / dispatching manually don't
        # need the secret.
        if: |
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && env.PLAY_JSON != ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.echo_messenger
          releaseFiles: apps/client/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          # Release-notes source: pull from the GitHub release that this workflow
          # publishes later in the pipeline. To avoid a chicken-and-egg dep on
          # the release job, we hand-craft a one-line note here pointing at the
          # version. Operators can edit the notes in Play Console after upload
          # if they want the full GH release body.
          releaseName: ${{ needs.version.outputs.version }}

  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 90
    needs: [paths, version, lint-test-flutter]
    if: |
      always()
      && needs.version.result == 'success'
      && (needs.lint-test-flutter.result == 'success' || needs.lint-test-flutter.result == 'skipped')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - name: Cache pub-cache + .dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client/.dart_tool
          key: ${{ runner.os }}-pubcache-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            apps/client/ios/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-ios-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-ios-
      - name: Select latest Xcode
        run: |
          # Find the highest-versioned Xcode on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Install CocoaPods
        run: gem install cocoapods
      - name: Verify iOS signing secrets present
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_CERTIFICATE_BASE64" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::iOS signing secrets missing. Refusing to ship unsigned IPA."
            exit 1
          fi
      - name: Set up code signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_BROADCAST_PROFILE_BASE64: ${{ secrets.IOS_BROADCAST_PROFILE_BASE64 }}
          IOS_NOTIFICATION_SERVICE_PROFILE_BASE64: ${{ secrets.IOS_NOTIFICATION_SERVICE_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          BROADCAST_PP_PATH=$RUNNER_TEMP/build_broadcast_pp.mobileprovision
          NOTIF_PP_PATH=$RUNNER_TEMP/build_notif_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          echo "$IOS_BROADCAST_PROFILE_BASE64" | base64 --decode > "$BROADCAST_PP_PATH"
          echo "$IOS_NOTIFICATION_SERVICE_PROFILE_BASE64" | base64 --decode > "$NOTIF_PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Install main app provisioning profile
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
            $(security cms -D -i "$PP_PATH"))
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision

          # Install broadcast extension provisioning profile
          BROADCAST_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
            $(security cms -D -i "$BROADCAST_PP_PATH"))
          cp "$BROADCAST_PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${BROADCAST_UUID}.mobileprovision

          # Install notification service extension provisioning profile
          NOTIF_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
            $(security cms -D -i "$NOTIF_PP_PATH"))
          cp "$NOTIF_PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${NOTIF_UUID}.mobileprovision
      - name: Set up App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Configure signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/g" \
            apps/client/ios/ExportOptions.plist
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/g" \
            apps/client/ios/Runner.xcodeproj/project.pbxproj
      - name: Build IPA
        working-directory: apps/client
        run: |
          flutter pub get
          flutter build ipa --release \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION=${{ needs.version.outputs.version }} \
            --export-options-plist=ios/ExportOptions.plist
      - name: Rename IPA
        run: |
          IPA_FILE=$(find apps/client/build/ios -name "*.ipa" -type f | head -1)
          echo "Found IPA: $IPA_FILE"
          cp "$IPA_FILE" echo-ios-${{ needs.version.outputs.version }}.ipa
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          # altool can exit 0 even when the upload fails Apple-side
          # validation (e.g. invalid Info.plist values in v0.0.298),
          # so capture the output and grep for the failure marker.
          UPLOAD_LOG=$(mktemp)
          if xcrun altool --upload-app \
              -f echo-ios-${{ needs.version.outputs.version }}.ipa \
              -t ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$UPLOAD_LOG"
          then
            if grep -qE 'UPLOAD FAILED|Validation failed|ERROR ITMS' "$UPLOAD_LOG"; then
              echo "::error::altool reported a validation failure even though it exited 0"
              exit 1
            fi
          else
            echo "::error::altool returned a non-zero exit code"
            exit 1
          fi
      - name: Upload iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ios
          path: echo-ios-*.ipa
          retention-days: 3
      - name: Clean up signing
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/private_keys/AuthKey_*.p8 || true

