name: echo_app
description: Decentralized encrypted messenger
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.3.0
  http: ^1.3.0
  http_parser: ^4.1.0
  uuid: ^4.6.0
  web_socket_channel: ^3.0.0
  cryptography: ^2.7.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^10.3.1
  google_fonts: ^8.2.0
  url_launcher: ^6.3.0
  file_picker: ^11.0.2
  qr_flutter: ^4.1.0
  audioplayers: ^6.8.1
  record: ^6.2.0
  web: ^1.1.0
  flutter_webrtc: 1.4.0
  dart_webrtc: ^1.8.1
  livekit_client: ^2.8.1
  # video_player has no Linux desktop backend (#727), so we use media_kit
  # everywhere for a single libmpv-backed video stack on every platform
  # (Linux/Windows/macOS/iOS/Android/Web). media_kit_libs_video bundles
  # the native libmpv binaries so users don't need a system install.
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.5
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_local_notifications: ^22.0.1
  path: ^1.9.0
  path_provider: ^2.1.0
  emoji_picker_flutter: ^4.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  photo_manager: ^3.10.0
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  local_auth: ^3.0.1
  desktop_drop: ^0.7.1
  flutter_slidable: ^3.1.1
  image: ^4.9.1
  flutter_colorpicker: ^1.1.0
  flutter_callkit_incoming: ^3.1.3
  flutter_markdown_plus: ^1.0.4
  # Algorithm-only package (~30 KB) — emits a stroke outline polygon from a
  # raw point list with velocity-thinned smoothing. Used locally on the canvas
  # active-stroke + committed-stroke painters; wire format stays raw points so
  # encryption + WS sync + multi-device authority are unchanged. See
  # docs/voice-lounge/05-canvas-rewrite-spec.md §B.3.
  perfect_freehand: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  mockito: ^5.6.4
  mocktail: ^1.0.4
  build_runner: ^2.6.1
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  network_image_mock: ^2.1.1
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  fonts:
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf

dependency_overrides:
  # Stub out broken record_linux — voice recording is mobile/web only.
  record_linux:
    path: record_linux_stub
  # connectivity_plus 7.x uses NWPath.isUltraConstrained which requires
  # the macOS 26 SDK (Xcode 26). GitHub macOS-15 runners ship Xcode 16.4
  # with macOS 15.5 SDK, so pin to 6.x until runners upgrade.
  connectivity_plus: ^6.1.5
  # livekit_client 2.7.0 pins flutter_webrtc to exactly 1.4.0, but 1.4.1
  # has iOS-specific bug fixes that may resolve the production iOS voice
  # lounge crash (room.connect / setMicrophoneEnabled native EXC_BAD_ACCESS
  # on iPhone 16 / iOS 26.5). Override the pin so we get 1.4.1; revert if
  # this introduces new iOS-side regressions.
  flutter_webrtc: 1.4.1
  # flutter_secure_storage_darwin 0.3.0 uses CryptoKit (SymmetricKey, AES)
  # without an @available(iOS 13, *) guard at every call site, which
  # breaks the iOS Release build. The plugin's SwiftPM Package.swift
  # declares a min iOS lower than 13.0, and Podfile post-install hooks
  # don't affect SPM-resolved packages. 0.3.1 fixed the missing
  # availability check upstream. Override to 0.3.1 until
  # flutter_secure_storage rolls forward to a version that pins this
  # transitively.
  flutter_secure_storage_darwin: 0.3.1
  # device_info_plus 12.x and 13.x both call [NSProcessInfo isiOSAppOnVision]
  # behind an @available(iOS 26.1, *) guard. iOS 26.1 is a *future* SDK
  # version that the macOS-15 GitHub runner's Xcode 16.4 / iOS 18 SDK
  # does not recognise, so the compiler can't see the selector and the
  # build fails with:
  #
  #     ARC Semantic Issue (Xcode): No visible @interface for
  #     'NSProcessInfo' declares the selector 'isiOSAppOnVision'
  #     FPPDeviceInfoPlusPlugin.m:34
  #
  # 11.5.0 pre-dates the feature entirely and builds clean against the
  # current Xcode. Pin to 11.5.0 until either:
  #   - the GitHub macOS runners ship a newer Xcode that knows about
  #     iOS 26.1 (likely 2026-Q3), at which point we can revisit; OR
  #   - device_info_plus 14.x ships with a forward-compatible guard
  #     (e.g. by feature-detecting the selector at runtime instead).
  device_info_plus: 11.5.0
