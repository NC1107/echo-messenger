<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <!--
    Viewport + body reset are required for reliable pointer-event routing in
    Flutter web (CanvasKit). Without `margin:0` on <body>, the default 8px
    body margin pushes the flutter-view down so clicks near the top/left edge
    of the canvas land outside Flutter's hit-test grid (#904). Without
    `overflow:hidden` an accidental wheel/touch can scroll <body>, shifting
    the canvas relative to the viewport between frames, which manifests as
    "clicks need two presses" or "clicks land on nothing" in Chrome.
    `touch-action: manipulation` disables double-tap-to-zoom delay so the
    first click registers immediately on touch-capable laptops.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="echo_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" media="(prefers-color-scheme: light)"/>
  <link rel="icon" type="image/png" href="favicon-dark.png" media="(prefers-color-scheme: dark)"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Echo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    /* Ensure the Flutter glass pane always sits above any browser-injected
       overlay and accepts pointer events. CanvasKit routes hit-tests through
       this element; a stray `pointer-events: none` or a competing stacking
       context can silently swallow clicks. */
    flutter-view, flt-glass-pane {
      pointer-events: auto !important;
      user-select: none;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
